name: 🚀 Deploy

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'static/**'
      - 'worker/**'
      - 'crawler/afterlife/**'
      - 'package*.json'
      - 'vite.config.ts'
      - 'wrangler.jsonc'
      - '.github/workflows/deploy.yml'
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: 🚀 Crawl, build and deploy
    if: github.repository_owner == 'NotAFlightRisk'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    environment:
      name: production
      url: https://afterlife.peng.ly
    defaults:
      run:
        shell: bash
    env:
      # the crawl's SQLite lives in a private R2 bucket between runs
      STATE: https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/r2/buckets/afterlife-state/objects/afterlife.db.gz
      CRAWL: ${{ vars.CRAWL_HERE == 'true' && github.event_name != 'push' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Fetch the crawl so far
        id: fetch
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          mkdir -p data
          curl -fsS -H "Authorization: Bearer $TOKEN" "$STATE" | gunzip > data/afterlife.db
          fetched=$(python3 scripts/counts.py data/afterlife.db)
          echo "FETCHED=$fetched" >> "$GITHUB_ENV"
          echo "📦 $(du -h data/afterlife.db | cut -f1) of crawl state: $fetched" >> "$GITHUB_STEP_SUMMARY"

      - name: Check this week's slice
        if: env.CRAWL == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          afterlife() { uv run --project crawler afterlife "$@"; }
          afterlife stories
          afterlife fronts
          afterlife crawl --recheck --minutes 200
          afterlife wayback --minutes 45
          { echo '```'; afterlife stats; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # even when the crawl fell over, so a week's checks aren't lost, but never a smaller copy
      - name: Put the crawl back
        if: always() && env.CRAWL == 'true' && steps.fetch.outcome == 'success'
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 scripts/counts.py data/afterlife.db --at-least "$FETCHED"
          gzip -c data/afterlife.db | curl -fsS -X PUT -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/gzip" --data-binary @- "$STATE" > /dev/null

      - name: Build the data
        run: uv run --project crawler afterlife build --out static/data
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          PUBLIC_PLAUSIBLE_SCRIPT: ${{ vars.PUBLIC_PLAUSIBLE_SCRIPT }}
          PUBLIC_SENTRY_DSN: ${{ vars.PUBLIC_SENTRY_DSN }}
          SENTRY_URL: ${{ vars.SENTRY_URL }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Push it to Cloudflare
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Check the site picked it up
        run: |
          site=$(node -p "require('./package.json').homepage")
          want=$(cat build/_app/version.json)
          for i in $(seq 1 10); do
            if [ "$(curl -fsS "$site/_app/version.json?$i")" = "$want" ]; then
              echo "✅ [$site]($site) is serving \`$want\`" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 6
          done
          echo "❌ [$site]($site) is still on an older build" >> "$GITHUB_STEP_SUMMARY"
          exit 1
