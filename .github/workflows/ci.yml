name: 🚦 CI

on:
  pull_request:
    paths: ["crawler/**", ".github/workflows/ci.yml"]
  push:
    branches: [main]
    paths: ["crawler/**", ".github/workflows/ci.yml"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: crawler

jobs:
  check:
    name: ${{ matrix.emoji }} ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: lint
            emoji: 🎨
            run: uv run ruff check && uv run ruff format --check
          - label: tests
            emoji: 🧪
            run: uv run pytest -q
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: crawler/uv.lock
      - run: uv sync --locked
      - run: ${{ matrix.run }}
