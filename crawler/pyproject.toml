[project]
name = "afterlife"
version = "0.0.0"
description = "Checks every link that made Hacker News and sorts it by what became of it"
requires-python = ">=3.12"
dependencies = ["aiohttp>=3.12"]

[project.scripts]
afterlife = "afterlife.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["SIM905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
